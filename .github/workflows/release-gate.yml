name: Release Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_release:
        description: 'Run full release gate (requires Apple secrets)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  release-gate:
    runs-on: macos-latest
    timeout-minutes: 60

    env:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      CSC_NAME: ${{ secrets.CSC_NAME }}
      CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_IDENTITY_AUTO_DISCOVERY }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      FLOWSTATE_BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run OTA update e2e tests
        run: pnpm --filter @flowstate/desktop exec vitest run src/main/ota-updater-e2e.test.ts

      - name: Run release gate (dry-run)
        if: github.event_name != 'workflow_dispatch' || inputs.full_release == 'false'
        run: pnpm gate:release -- --dry-run

      - name: Run release gate (full)
        if: github.event_name == 'workflow_dispatch' && inputs.full_release == 'true'
        run: pnpm gate:release

      - name: Upload gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-artifacts
          path: .opencode/artifacts
          if-no-files-found: warn

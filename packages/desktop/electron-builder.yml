appId: com.flowstate.app
productName: FlowState
copyright: Copyright © 2026 Luke Brevoort

directories:
  output: out
  buildResources: assets

files:
  - dist/**/*
  - assets/**/*
  - "!**/*.map"
  - "!**/node_modules/*/{CHANGELOG.md,README.md,readme.md,readme,test,__tests__,tests,powered-test,example,examples}"

extraResources:
  - from: ../../agents
    to: agents
  - from: ../../workflows
    to: workflows
  - from: ../mcp-gmail/dist
    to: mcp-servers/mcp-gmail/dist
  - from: ../mcp-gmail/package.json
    to: node_modules/@flowstate/mcp-gmail/package.json
  - from: ../mcp-gmail/dist
    to: node_modules/@flowstate/mcp-gmail/dist
  - from: ../mcp-notion/dist
    to: mcp-servers/mcp-notion/dist
  - from: ../mcp-notion/package.json
    to: node_modules/@flowstate/mcp-notion/package.json
  - from: ../mcp-notion/dist
    to: node_modules/@flowstate/mcp-notion/dist
  - from: ../mcp-gcal/dist
    to: mcp-servers/mcp-gcal/dist
  - from: ../mcp-gcal/package.json
    to: node_modules/@flowstate/mcp-gcal/package.json
  - from: ../mcp-gcal/dist
    to: node_modules/@flowstate/mcp-gcal/dist
  - from: ../mcp-system/dist
    to: mcp-servers/mcp-system/dist
  - from: ../mcp-system/package.json
    to: node_modules/@flowstate/mcp-system/package.json
  - from: ../mcp-system/dist
    to: node_modules/@flowstate/mcp-system/dist
  - from: ../mcp-canvas/dist
    to: mcp-servers/mcp-canvas/dist
  - from: ../mcp-canvas/package.json
    to: node_modules/@flowstate/mcp-canvas/package.json
  - from: ../mcp-canvas/dist
    to: node_modules/@flowstate/mcp-canvas/dist
  - from: vendor/opencode/darwin-arm64/opencode
    to: bin/opencode-darwin-arm64
  - from: vendor/opencode/darwin-x64/opencode
    to: bin/opencode-darwin-x64
  - from: vendor/node/darwin-arm64
    to: node-runtime/darwin-arm64
  - from: vendor/node/darwin-x64
    to: node-runtime/darwin-x64

mac:
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  icon: assets/flowstate-main-logo.icns
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: assets/entitlements.mac.plist
  entitlementsInherit: assets/entitlements.mac.inherit.plist
  darkModeSupport: true

afterSign: scripts/sign-nested-binaries.mjs

dmg:
  background: null
  icon: assets/flowstate-main-logo.icns
  iconSize: 100
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
  window:
    width: 540
    height: 380

# Windows configuration (for future)
win:
  target:
    - target: nsis
      arch: [x64]
  icon: assets/flowstate-main-logo.png

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

# Linux configuration (for future)
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  icon: assets/flowstate-main-logo.png
  category: Office

# Auto-update configuration
publish:
  provider: github
  owner: lbrevoort
  repo: flowstate
  releaseType: release

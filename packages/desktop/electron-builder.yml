appId: com.flowstate.app
productName: FlowState
copyright: Copyright © 2026 Luke Brevoort

directories:
  output: out
  buildResources: assets

files:
  - dist/**/*
  - assets/**/*
  - "!**/*.map"
  - "!**/node_modules/*/{CHANGELOG.md,README.md,readme.md,readme,test,__tests__,tests,powered-test,example,examples}"

mac:
  target:
    - target: dmg
      arch: [universal]
    - target: zip
      arch: [universal]
  icon: assets/flowstate-main-logo.png
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: null
  entitlementsInherit: null
  darkModeSupport: true

dmg:
  background: null
  icon: assets/flowstate-main-logo.png
  iconSize: 100
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
  window:
    width: 540
    height: 380

# Windows configuration (for future)
win:
  target:
    - target: nsis
      arch: [x64]
  icon: assets/flowstate-main-logo.png

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

# Linux configuration (for future)
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  icon: assets/flowstate-main-logo.png
  category: Office

# Auto-update configuration (future)
publish: null
